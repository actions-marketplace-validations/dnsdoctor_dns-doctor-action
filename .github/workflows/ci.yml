name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  self-test:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Scan (never fails the job; the summary is the check)
        id: scan
        uses: ./
        with:
          domain: dnsdoctor.dev
          fail-on: never
      - run: 'test -n "${{ steps.scan.outputs.status }}" && test -f "${{ steps.scan.outputs.report-path }}"'
      - name: Propagation of a stable record
        uses: ./
        with:
          domain: dnsdoctor.dev
          mode: propagation
          record-type: NS
          timeout-minutes: "2"
          interval-seconds: "30"
